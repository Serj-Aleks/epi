<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwest</title>
<style>
  :root { --bg: #000; --fg: #ddd; --dim: #777; --acc: #e8c35a; --err: #e07a6a; --line: #222; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.5 "DejaVu Sans Mono", "Noto Sans Mono", monospace; }
  body { display: flex; flex-direction: column; }
  #log { flex: 1; overflow-y: auto; padding: 16px 16px 8px; }
  .turn { margin: 0 0 10px; }
  .pred { color: var(--fg); white-space: pre-wrap; word-break: break-word; }
  .pred::before { content: "› "; color: var(--acc); }
  .ans { display: flex; gap: 12px; align-items: baseline; padding-left: 2ch;
    white-space: pre-wrap; word-break: break-word; }
  .ans .v { color: var(--acc); }
  .ans.err .v { color: var(--err); }
  .ans .f { margin-left: auto; color: var(--dim); font-size: 13px; }
  .q { padding-left: 2ch; color: var(--fg); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .q button { background: none; border: 1px solid var(--line); color: var(--fg); width: 32px; height: 28px;
    border-radius: 4px; cursor: pointer; font: inherit; }
  .q button:hover, .q button:focus { border-color: var(--acc); color: var(--acc); outline: none; }
  form { display: flex; border-top: 1px solid var(--line); }
  form::before { content: "›"; color: var(--acc); padding: 12px 0 12px 16px; }
  input { flex: 1; background: none; border: 0; color: var(--fg); font: inherit; padding: 12px 16px 12px 1ch; outline: none; }
  input:disabled { opacity: .4; }
</style>
</head>
<body>
<div id="log" aria-live="polite"></div>
<form id="f" autocomplete="off"><input id="i" title="predicatio" autofocus spellcheck="false"></form>
<script>
const log = document.getElementById("log"), inp = document.getElementById("i");
const hist = []; let hpos = 0;

function el(cls, text) { const d = document.createElement("div"); d.className = cls; if (text !== undefined) d.textContent = text; return d; }
function scroll() { log.scrollTop = log.scrollHeight; }

function addPred(text) { const t = el("turn"); t.append(el("pred", text)); log.append(t); scroll(); return t; }
function addAnswer(t, turn) {
  const a = el("ans" + (turn.error ? " err" : ""));
  a.append(el("v", turn.answer));
  const f = el("f", (turn.frames || []).join(" ")); f.title = "interpres"; a.append(f);
  t.append(a); scroll();
}

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

// ответ сервера: шаг завершён или вопрос диспетчера
function handle(t, rep) {
  if (rep.turn) { addAnswer(t, rep.turn); inp.disabled = false; inp.focus(); return; }
  const q = el("q", rep.question);
  const yes = document.createElement("button"); yes.textContent = "✓"; yes.title = "yes (y)";
  const no = document.createElement("button"); no.textContent = "✕"; no.title = "no (n)";
  q.append(yes, no); t.append(q); scroll(); yes.focus();
  const answer = async (v) => {
    document.removeEventListener("keydown", key);
    yes.remove(); no.remove(); q.append(el("f", v ? "✓" : "✕"));
    handle(t, await api("/api/answer", { answer: v }));
  };
  const key = (e) => { if (e.key === "y") answer(true); if (e.key === "n") answer(false); };
  yes.onclick = () => answer(true); no.onclick = () => answer(false);
  document.addEventListener("keydown", key);
}

document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const text = inp.value.trim(); if (!text) return;
  hist.push(text); hpos = hist.length; inp.value = ""; inp.disabled = true;
  const t = addPred(text);
  try { handle(t, await api("/api/eval", { text })); }
  catch (err) { addAnswer(t, { answer: String(err.message), error: true }); inp.disabled = false; inp.focus(); }
};

inp.addEventListener("keydown", (e) => {
  if (e.key === "ArrowUp" && hpos > 0) { inp.value = hist[--hpos]; e.preventDefault(); }
  if (e.key === "ArrowDown") { hpos = Math.min(hist.length, hpos + 1); inp.value = hist[hpos] || ""; e.preventDefault(); }
});

api("/api/history").then((h) => {
  for (const turn of h.turns || []) { const t = addPred(turn.pred); addAnswer(t, turn); hist.push(turn.pred); }
  hpos = hist.length;
  // ожидающий вопрос диспетчера переживает перезагрузку страницы
  if (h.pending && h.pending.question) { inp.disabled = true; handle(addPred(h.pending.pred), { question: h.pending.question }); }
});
</script>
</body>
</html>
