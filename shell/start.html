<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>APOTHEOS</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; color: #ddd;
    font: 20px/1.5 sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  .box { text-align: center; }
  .dots::after { content: ""; animation: d 1.5s steps(4) infinite; }
  @keyframes d { 0% { content: ""; } 25% { content: "."; }
    50% { content: ".."; } 75% { content: "..."; } }
  .hint { margin-top: 1em; font-size: 16px; color: #888; visibility: hidden; }
</style>
</head>
<body>
<div class="box">
  <div>Подключение к сети<span class="dots"></span></div>
  <div class="hint" id="hint">Сеть не подключена.<br>
    Выберите сеть: значок сети внизу справа.</div>
</div>
<script>
  // EPI: сеть проверяет система (epi-browser). Когда ui.center отвечает, она
  // кладёт рядом файл online.js (window.EPI_ONLINE = 1). Страница сама в сеть
  // не ходит: подгружает этот локальный файл каждые 2 с и переходит, как только
  // он появился. Если 15 с сигнала нет — подсказка выбрать сеть.
  var TARGET = "https://ui.center/";
  var started = Date.now();
  function check() {
    var s = document.createElement("script");
    s.src = "online.js?t=" + Date.now();
    s.onload = function () {
      if (window.EPI_ONLINE) { location.replace(TARGET); return; }
      again();
    };
    s.onerror = again;
    document.head.appendChild(s);
    function again() {
      s.remove();
      if (Date.now() - started > 15000)
        document.getElementById("hint").style.visibility = "visible";
      setTimeout(check, 2000);
    }
  }
  check();
</script>
</body>
</html>
